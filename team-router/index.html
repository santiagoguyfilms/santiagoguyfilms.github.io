const input = document.getElementById('query');
const resultsContainer = document.getElementById('results');
const teamGrid = document.getElementById('teamGrid');

team.forEach(member => {
  const chip = document.createElement('div');
  chip.className = 'team-chip';
  chip.innerHTML = '<div class="chip-emoji">' + member.emoji + '</div><div class="chip-name">' + member.name + '</div><div class="chip-role">' + member.role.split('&')[0].trim() + '</div>';
  chip.addEventListener('click', function() { showResult([{ member: member, score: 100, matchType: 'direct' }]); });
  teamGrid.appendChild(chip);
});

function scoreMatch(query, member) {
  var q = query.toLowerCase().trim();
  var score = 0;
  var matchType = 'keyword';
  if (q.includes(member.name.toLowerCase())) { score += 100; matchType = 'name'; }
  for (var i = 0; i < member.keywords.length; i++) {
    var kw = member.keywords[i];
    if (q.includes(kw.toLowerCase())) { score += 12; }
    else { var words = kw.split(' '); for (var j = 0; j < words.length; j++) { if (words[j].length > 3 && q.includes(words[j].toLowerCase())) score += 5; } }
  }
  if (member.synonyms) {
    for (var i = 0; i < member.synonyms.length; i++) {
      var syn = member.synonyms[i];
      if (q.includes(syn.toLowerCase())) { score += 10; }
      else { var sw = syn.split(' '); for (var j = 0; j < sw.length; j++) { if (sw[j].length > 3 && q.includes(sw[j].toLowerCase())) score += 4; } }
    }
  }
  var roleWords = member.role.toLowerCase().split(/\W+/);
  for (var i = 0; i < roleWords.length; i++) { if (roleWords[i].length > 3 && q.includes(roleWords[i])) score += 7; }
  if (member.alsoHelps) {
    for (var i = 0; i < member.alsoHelps.length; i++) {
      var ahWords = member.alsoHelps[i].toLowerCase().split(/\W+/);
      for (var j = 0; j < ahWords.length; j++) { if (ahWords[j].length > 3 && q.includes(ahWords[j])) score += 3; }
    }
  }
  for (var i = 0; i < conceptMap.length; i++) {
    var concept = conceptMap[i];
    if (concept.members.includes(member.name)) {
      var hits = 0;
      for (var j = 0; j < concept.concepts.length; j++) { if (q.includes(concept.concepts[j].toLowerCase())) hits++; }
      if (hits > 0) score += hits * concept.weight;
    }
  }
  return { score: score, matchType: matchType };
}

function checkCasualPhrases(query) {
  var q = query.toLowerCase().trim();
  var boosts = {};
  var entries = Object.entries(casualPhrases);
  for (var i = 0; i < entries.length; i++) {
    var phrase = entries[i][0], names = entries[i][1];
    var phraseWords = phrase.split(' ');
    var matching = phraseWords.filter(function(w) { return w.length > 2 && q.includes(w); });
    if (matching.length >= Math.ceil(phraseWords.length * 0.6)) {
      for (var j = 0; j < names.length; j++) { boosts[names[j]] = (boosts[names[j]] || 0) + 8; }
    }
  }
  return boosts;
}

function checkNewHireSuggestion(query) {
  var q = query.toLowerCase().trim();
  for (var i = 0; i < newHireSuggestions.length; i++) {
    var hire = newHireSuggestions[i];
    var matchCount = hire.topics.filter(function(t) { return q.includes(t); }).length;
    if (matchCount > 0) return hire;
    var allWords = hire.topics.join(' ').split(/\W+/);
    var wordMatches = allWords.filter(function(w) { return w.length > 3 && q.includes(w); });
    if (wordMatches.length >= 2) return hire;
  }
  return null;
}

function findMatches(query) {
  if (!query.trim()) return { matches: [], newHire: null };
  var casualBoosts = checkCasualPhrases(query);
  var scored = team.map(function(m) {
    var result = scoreMatch(query, m);
    var boost = casualBoosts[m.name] || 0;
    return { member: m, score: result.score + boost, matchType: result.matchType };
  }).filter(function(s) { return s.score > 0; }).sort(function(a, b) { return b.score - a.score; });
  var newHire = checkNewHireSuggestion(query);
  if (scored.length === 0) return { matches: [], newHire: newHire };
  var top = scored[0];
  var results = [top];
  for (var i = 1; i < scored.length && i < 3; i++) {
    if (scored[i].score >= top.score * 0.4) { scored[i].matchType = 'related'; results.push(scored[i]); }
  }
  return { matches: results, newHire: newHire };
}

function showResult(matches, newHire) {
  resultsContainer.innerHTML = '';
  if (matches.length === 0 && !newHire) {
    var card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = '<div class="name">Nobody on the team handles this yet</div><div class="personality" style="margin-top:0.5rem;">Try describing it differently, or tap a team member below. If this is truly a gap, request a new employee below.</div>';
    resultsContainer.appendChild(card);
    requestAnimationFrame(function() { card.classList.add('visible'); });
    var reqCard = buildRequestCard(input.value.trim());
    resultsContainer.appendChild(reqCard);
    setTimeout(function() { reqCard.classList.add('visible'); }, 150);
    return;
  }
  matches.forEach(function(item, i) {
    var member = item.member || item;
    var isTop = i === 0;
    var card = document.createElement('div');
    card.className = 'result-card';
    var badge = isTop ? '<span class="badge-primary">Best Match</span>' : '<span class="badge-also">Also Relevant</span>';
    var alsoHelpsHtml = member.alsoHelps ? '<div class="also-helps"><strong>Also helps with:</strong> ' + member.alsoHelps.join(' \u00b7 ') + '</div>' : '';
    card.innerHTML = '<div class="avatar" style="background:' + member.color + '">' + member.emoji + '</div><div class="name">' + member.name + ' ' + (matches.length > 1 ? badge : '') + '</div><div class="role">' + member.role + '</div><div class="personality">' + member.personality + '</div>' + alsoHelpsHtml + '<div class="keywords">' + member.keywords.slice(0, 8).map(function(k) { return '<span>' + k + '</span>'; }).join('') + '</div><div class="cta">To activate \u2192 <strong>' + member.trigger + '</strong></div>';
    resultsContainer.appendChild(card);
    setTimeout(function() { card.classList.add('visible'); }, i * 100);
  });
  if (newHire) {
    var hireCard = document.createElement('div');
    hireCard.className = 'new-hire-card';
    hireCard.innerHTML = '<div class="hire-title">New Hire Idea: ' + newHire.suggestion + '</div><div class="hire-body">' + newHire.description + ' <strong>None of the current team specializes in this</strong> \u2014 might be worth building a new skill for it.</div>';
    resultsContainer.appendChild(hireCard);
    setTimeout(function() { hireCard.classList.add('visible'); }, matches.length * 100 + 100);
    var reqCard = buildRequestCard(input.value.trim());
    resultsContainer.appendChild(reqCard);
    setTimeout(function() { reqCard.classList.add('visible'); }, matches.length * 100 + 250);
  }
}

function buildRequestCard(prefill) {
  var reqCard = document.createElement('div');
  reqCard.className = 'request-card';
  reqCard.innerHTML = '<div class="req-title">Request a New Team Member</div><div class="req-desc">Describe the skill or role you need. This will be saved so we can build the right employee for it.</div><textarea id="newEeRequest" placeholder="e.g. I need someone who can handle podcast editing and distribution...">' + (prefill || '') + '</textarea><button onclick="submitRequest()">Submit Request</button><div class="req-success" id="reqSuccess">Request saved! We\'ll build this team member for you.</div>';
  return reqCard;
}

function submitRequest() {
  var textarea = document.getElementById('newEeRequest');
  var successMsg = document.getElementById('reqSuccess');
  var val = textarea.value.trim();
  if (!val) return;
  var requests = JSON.parse(localStorage.getItem('sgf_ee_requests') || '[]');
  requests.push({ request: val, date: new Date().toISOString() });
  localStorage.setItem('sgf_ee_requests', JSON.stringify(requests));
  successMsg.style.display = 'block';
  textarea.disabled = true;
  textarea.style.opacity = '0.5';
}

var debounceTimer;
input.addEventListener('input', function() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(function() {
    var q = input.value.trim();
    if (q.length < 2) { resultsContainer.innerHTML = ''; return; }
    var result = findMatches(q);
    showResult(result.matches, result.newHire);
  }, 250);
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    clearTimeout(debounceTimer);
    var q = input.value.trim();
    if (q.length < 2) return;
    var result = findMatches(q);
    showResult(result.matches, result.newHire);
  }
});
